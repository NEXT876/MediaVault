name: CI

# Only the release path runs CI: the develop -> main pull request, and the
# squash commit that lands on main (it also publishes the coverage badge).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    if: github.event_name == 'push' || github.head_ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      # Write access is only used by the coverage badge step on pushes to main.
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt-Systembibliotheken
        timeout-minutes: 10
        run: |
          pkgs="libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1"
          if dpkg -s $pkgs >/dev/null 2>&1; then
            echo "All Qt libraries already installed"
            exit 0
          fi
          # The runner's Ubuntu mirrors fail DNS now and then; retry with backoff.
          for attempt in 1 2 3 4; do
            sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 $pkgs \
              && exit 0
            [ "$attempt" -lt 4 ] && sleep $((attempt * 15))
          done
          exit 1
      - name: Abhängigkeiten
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check mediavault tests
      - name: Tests
        run: pytest -q --cov=mediavault
      - name: Coverage-Badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pct=$(coverage report --format=total)
          dir="$RUNNER_TEMP/badges"
          if git fetch --depth=1 origin badges; then
            git worktree add -B badges "$dir" FETCH_HEAD
          else
            git worktree add --orphan -b badges "$dir"
          fi
          python -c '
          import json, sys
          pct = int(sys.argv[1])
          color = next(c for limit, c in ((90, "brightgreen"), (80, "green"),
                       (70, "yellow"), (60, "orange"), (0, "red")) if pct >= limit)
          print(json.dumps({"schemaVersion": 1, "label": "coverage",
                            "message": f"{pct}%", "color": color}))
          ' "$pct" > "$dir/coverage.json"
          cd "$dir"
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged: $pct%"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Coverage $pct%"
          git push origin HEAD:badges
