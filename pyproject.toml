[project]
name = "mediavault"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.4", "opencv-python>=4.8"]

[project.scripts]
mediavault = "mediavault.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "DTZ"]
